[pytest]
testpaths = backend/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    integration: hits real local MySQL/PostgreSQL/Redis/MongoDB (test-owned rows only)
    perf: performance measurements (long-running)
filterwarnings =
    ignore::DeprecationWarning:pipecat.*
