<svg viewBox="0 0 1160 680" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="au-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="au-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
    <style>
      .life { stroke: #B9C2D4; stroke-width: 1; stroke-dasharray: 4 4; }
      .head { rx: 8; stroke-width: 1.5; }
      .ht { font-size: 11.5px; font-weight: 700; fill: #1F2937; }
      .hs { font-size: 8.6px; fill: #55607A; }
      .m { stroke: #475569; stroke-width: 1.4; fill: none; }
      .mr { stroke: #2563EB; stroke-width: 1.4; fill: none; stroke-dasharray: 6 3; }
      .ml { font-size: 9.2px; fill: #1F2937; paint-order: stroke; stroke: #FFFFFF; stroke-width: 3px; font-weight: 600; }
      .note { font-size: 8.6px; fill: #55607A; }
      .phase { fill: #EEF0FE; stroke: #4F46E5; stroke-width: 0.8; rx: 4; }
      .pt { font-size: 9.6px; font-weight: 700; fill: #4F46E5; letter-spacing: 0.8px; }
    </style>
  </defs>

  <g>
    <rect class="head" x="30" y="20" width="180" height="52" fill="#DBEAFE" stroke="#2563EB"/>
    <text class="ht" x="120" y="42" text-anchor="middle">Browser SPA</text>
    <text class="hs" x="120" y="58" text-anchor="middle">Login.tsx &#183; AppContext &#183; http.ts</text>
    <rect class="head" x="300" y="20" width="190" height="52" fill="#E0E7FF" stroke="#4F46E5"/>
    <text class="ht" x="395" y="42" text-anchor="middle">POST /api/v1/auth/login</text>
    <text class="hs" x="395" y="58" text-anchor="middle">backend/routers/auth.py</text>
    <rect class="head" x="560" y="20" width="190" height="52" fill="#E0E7FF" stroke="#4F46E5"/>
    <text class="ht" x="655" y="42" text-anchor="middle">Security core</text>
    <text class="hs" x="655" y="58" text-anchor="middle">bcrypt &#183; HS256 JWT (security.py)</text>
    <rect class="head" x="820" y="20" width="170" height="52" fill="#DCFCE7" stroke="#16A34A"/>
    <text class="ht" x="905" y="42" text-anchor="middle">MySQL</text>
    <text class="hs" x="905" y="58" text-anchor="middle">users &#183; roles &#183; permissions</text>
  </g>
  <line class="life" x1="120" y1="72" x2="120" y2="650"/>
  <line class="life" x1="395" y1="72" x2="395" y2="650"/>
  <line class="life" x1="655" y1="72" x2="655" y2="650"/>
  <line class="life" x1="905" y1="72" x2="905" y2="650"/>

  <!-- phase 1 -->
  <rect class="phase" x="30" y="90" width="240" height="20"/>
  <text class="pt" x="42" y="104">PHASE 1 &#183; SIGN-IN</text>

  <path class="m" d="M133 132 L 391 132" marker-end="url(#au-a)"/>
  <text class="ml" x="150" y="126">{ email, password }</text>
  <path class="m" d="M408 158 L 901 158" marker-end="url(#au-a)"/>
  <text class="ml" x="424" y="152">lookup by lower(email), is_deleted = false</text>
  <path class="m" d="M408 186 L 651 186" marker-end="url(#au-a)"/>
  <text class="ml" x="424" y="180">verify_password (bcrypt)</text>
  <text class="note" x="424" y="200">unknown user OR wrong password &#8594; one generic 401 &#183; deactivated &#8594; 403 &#183; tenant suspended/deleted &#8594; 403</text>
  <path class="m" d="M408 226 L 901 226" marker-end="url(#au-a)"/>
  <text class="ml" x="424" y="220">invited &#8594; active &#183; last_login_at &#183; audit &#8220;Signed in&#8221; (same txn)</text>
  <path class="m" d="M408 254 L 651 254" marker-end="url(#au-a)"/>
  <text class="ml" x="424" y="248">create_access_token</text>
  <text class="note" x="424" y="268">claims: sub &#183; role &#183; tenant_id &#183; iat &#183; exp (720 min) &#8212; HS256, no jti / aud / refresh token</text>
  <path class="mr" d="M382 292 L 133 292" marker-end="url(#au-b)"/>
  <text class="ml" x="150" y="286">{ token, user + permissions[] }</text>
  <text class="note" x="150" y="306">stored in localStorage: echosphere.token &#183; echosphere.session (XSS-readable &#8212; see risk register)</text>

  <!-- phase 2 -->
  <rect class="phase" x="30" y="326" width="330" height="20"/>
  <text class="pt" x="42" y="340">PHASE 2 &#183; EVERY AUTHENTICATED REQUEST</text>

  <path class="m" d="M133 368 L 391 368" marker-end="url(#au-a)"/>
  <text class="ml" x="150" y="362">Authorization: Bearer &lt;token&gt;</text>
  <path class="m" d="M408 394 L 901 394" marker-end="url(#au-a)"/>
  <text class="ml" x="424" y="388">get_current_user: decode &#8594; re-load User + Role + permissions from DB</text>
  <text class="note" x="424" y="408">authorization NEVER trusts token claims for role/permissions &#8212; the fresh ORM row decides;</text>
  <text class="note" x="424" y="420">then require_roles / require_permission (OR semantics) &#183; resolve_tenant_id / assert_tenant_access (404 cross-tenant)</text>
  <text class="note" x="424" y="432">costs.view gate strips financial fields from responses and exports for roles without it</text>

  <!-- phase 3 -->
  <rect class="phase" x="30" y="452" width="380" height="20"/>
  <text class="pt" x="42" y="466">PHASE 3 &#183; REVOCATION &amp; SESSION INVALIDATION</text>

  <path class="m" d="M133 494 L 391 494" marker-end="url(#au-a)"/>
  <text class="ml" x="150" y="488">POST /users/me/password &#183; POST /users/{id}/reset-password</text>
  <path class="m" d="M408 520 L 901 520" marker-end="url(#au-a)"/>
  <text class="ml" x="424" y="514">bcrypt re-hash + password_changed_at = now()</text>
  <path class="mr" d="M382 548 L 133 548" marker-end="url(#au-b)"/>
  <text class="ml" x="150" y="542">self-change: fresh token returned &#8212; other sessions die</text>
  <text class="note" x="424" y="564">every token with iat &lt; password_changed_at is rejected 401 on next use (deps.py:49-53)</text>
  <text class="note" x="424" y="578">logout writes an audit row only &#8212; the JWT stays valid until exp (no server-side revocation list)</text>

  <!-- rbac note -->
  <rect x="30" y="600" width="1100" height="52" rx="6" fill="#F0FBF3" stroke="#16A34A" stroke-width="0.8"/>
  <text class="note" x="48" y="620" font-weight="700" fill="#0F7B3E">RBAC model (seeded, DB-resolved)</text>
  <text class="note" x="48" y="634">3 roles &#8212; super_admin (platform, all 47 permissions) &#183; tenant_admin (30) &#183; tenant_user (12, no team/channels/settings/costs.view) &#8212; via roles / permissions / role_permissions;</text>
  <text class="note" x="48" y="646">hidden frontend buttons are never the security boundary: the same codes gate routes (App.tsx), nav (AppShell), Studio tabs and, authoritatively, every API dependency.</text>
</svg>
