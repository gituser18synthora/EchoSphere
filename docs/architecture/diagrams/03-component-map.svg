  <!-- ===== Voice runtime ===== -->
  <rect class="cl" x="644" y="20" width="280" height="360" fill="#ECFBF8" stroke="#0D9488"/>
  <text class="clabel" x="662" y="42" fill="#0D9488">VOICE RUNTIME (14.6k LOC)</text>
  <g>
    <rect class="mod" x="660" y="56" width="248" height="46" fill="#FFFFFF" stroke="#0D9488"/>
    <text class="mt" x="670" y="73">app.py + gateway.py</text>
    <text class="ms" x="670" y="86">session lifecycle &#183; WS endpoints &#183; :9002/:9011</text>
    <rect class="mod" x="660" y="110" width="248" height="46" fill="#FFFFFF" stroke="#0D9488"/>
    <text class="mt" x="670" y="127">pipeline.py &#8212; pipecat assembly</text>
