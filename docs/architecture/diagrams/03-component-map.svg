    <text class="ms" x="670" y="206">collections domain policy (recovery ladder)</text>
    <rect class="mod" x="660" y="224" width="120" height="52" fill="#FFFFFF" stroke="#0D9488"/>
    <text class="mt" x="670" y="241">tts_router.py</text>
    <text class="ms" x="670" y="254">streaming engines &#183;</text>
    <text class="ms" x="670" y="266">fallback &#183; sentences</text>
    <rect class="mod" x="788" y="224" width="120" height="52" fill="#FFFFFF" stroke="#0D9488"/>
    <text class="mt" x="798" y="241">STT adapters</text>
    <text class="ms" x="798" y="254">sarvam_stt &#183; deepgram</text>
    <text class="ms" x="798" y="266">_stt &#183; transcript_gate</text>
